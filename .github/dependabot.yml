# Dependabot version updates. Security updates are enabled in repo settings and
# open PRs immediately regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm # pnpm lockfile supported
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Lima
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
